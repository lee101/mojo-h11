[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-h11"
version = "0.1.0"
description = "Mojo-accelerated HTTP/1.1 state machine compatible with h11"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["h11>=0.16,<0.17"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
